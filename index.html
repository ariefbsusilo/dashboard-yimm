<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; frame-src https://script.google.com https://*.googleusercontent.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>New Dashboard | DDS 3 Yogyakarta</title>
  <link rel="stylesheet" href="style.css?v=header-2910-1">
  <script src="config.js" defer></script>
  <script src="app.js?v=header-2910-1" defer></script>
</head>
<body data-pages-build="header-2910-1">
  <!-- The dashboard inside Google supplies the single application header. -->
  <span id="status" class="sr-only" role="status" aria-live="polite">Menyiapkan dashboard…</span>
  <main id="main">
    <section id="setup" class="setup" hidden>
      <p class="eyebrow">NEW DASHBOARD</p>
      <h1 id="setupTitle">Hubungkan dashboard</h1>
      <p id="setupMessage">Isi appsScriptUrl pada config.js dengan URL deployment Apps Script yang berakhiran /exec.</p>
      <p class="hint">Panduan pemasangan ada pada README.md di paket ini.</p>
    </section>
    <iframe id="dashboard" title="New Dashboard DDS 3 Yogyakarta" allow="fullscreen" allowfullscreen hidden></iframe>
    <noscript>Aktifkan JavaScript untuk membuka dashboard.</noscript>
  </main>
  <details id="help" class="help" hidden>
    <summary aria-label="Bantuan dashboard" title="Bantuan dashboard">?</summary>
    <div class="help-menu" role="group" aria-label="Bantuan dashboard">
      <p>Jika dashboard belum terbuka, gunakan tautan langsung ke Google.</p>
      <a id="direct" class="direct" href="#" target="_blank" rel="noopener noreferrer" hidden>Buka langsung ↗</a>
      <button id="reload" type="button" hidden>Muat ulang tampilan</button>
    </div>
  </details>
</body>
</html>
